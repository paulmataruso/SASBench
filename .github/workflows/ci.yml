name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix web

      - name: Typecheck the server
        run: npm run typecheck

      - name: Check third-party notices
        run: npm run notices:check

      - name: Check the API reference
        run: npm run api:docs:check

      - name: Build the web console
        run: npm run build:web

      - name: Integration tests
        run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sasbench:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
